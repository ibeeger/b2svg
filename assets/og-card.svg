<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c8dff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#4c8dff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0 H0 V30" fill="none" stroke="#262d38" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#0f1115"/>
  <rect x="660" y="0" width="540" height="630" fill="url(#grid)"/>
  <circle cx="920" cy="300" r="330" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="6" fill="#4c8dff"/>

  <!-- bitmap: the shape as a grid of pixels -->
  <g fill="#8d99ab" fill-opacity="0.9">
    <rect x="875" y="340" width="30" height="30"/>
    <rect x="905" y="340" width="30" height="30"/>
    <rect x="845" y="370" width="30" height="30"/>
    <rect x="875" y="370" width="30" height="30"/>
    <rect x="905" y="370" width="30" height="30"/>
    <rect x="935" y="370" width="30" height="30"/>
    <rect x="815" y="400" width="30" height="30"/>
    <rect x="845" y="400" width="30" height="30"/>
    <rect x="875" y="400" width="30" height="30"/>
    <rect x="905" y="400" width="30" height="30"/>
    <rect x="935" y="400" width="30" height="30"/>
    <rect x="965" y="400" width="30" height="30"/>
    <rect x="785" y="430" width="30" height="30"/>
    <rect x="815" y="430" width="30" height="30"/>
    <rect x="845" y="430" width="30" height="30"/>
    <rect x="875" y="430" width="30" height="30"/>
    <rect x="905" y="430" width="30" height="30"/>
    <rect x="935" y="430" width="30" height="30"/>
    <rect x="965" y="430" width="30" height="30"/>
    <rect x="995" y="430" width="30" height="30"/>
    <rect x="755" y="460" width="30" height="30"/>
    <rect x="785" y="460" width="30" height="30"/>
    <rect x="815" y="460" width="30" height="30"/>
    <rect x="845" y="460" width="30" height="30"/>
    <rect x="875" y="460" width="30" height="30"/>
    <rect x="905" y="460" width="30" height="30"/>
    <rect x="935" y="460" width="30" height="30"/>
    <rect x="965" y="460" width="30" height="30"/>
    <rect x="995" y="460" width="30" height="30"/>
    <rect x="1025" y="460" width="30" height="30"/>
  </g>

  <!-- right: the same shape as a vector path with anchor points -->
  <path d="M905 240 L1055 430 L755 430 Z" fill="none" stroke="#4c8dff" stroke-width="7"
        stroke-linejoin="round" transform="translate(0,-130)"/>
  <g fill="#4c8dff">
    <circle cx="905" cy="110" r="13"/>
    <circle cx="1055" cy="300" r="13"/>
    <circle cx="755" cy="300" r="13"/>
  </g>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="80" y="176" fill="#4c8dff" font-size="27" font-weight="600" letter-spacing="1.5">svg.xiaohan.dev</text>
    <text x="80" y="286" fill="#e7ecf3" font-size="82" font-weight="700" letter-spacing="-1">Bitmap → Vector</text>
    <text x="80" y="352" fill="#8d99ab" font-size="31">PNG · JPEG · GIF · WebP  →  clean, scalable SVG</text>
    <text x="80" y="400" fill="#8d99ab" font-size="31">Free, no upload — everything runs in your browser</text>

    <g font-size="24" font-weight="600">
      <rect x="80" y="470" width="212" height="52" rx="26" fill="none" stroke="#262d38" stroke-width="2"/>
      <text x="106" y="503" fill="#e7ecf3">VTracer WASM</text>
      <rect x="308" y="470" width="196" height="52" rx="26" fill="none" stroke="#262d38" stroke-width="2"/>
      <text x="334" y="503" fill="#e7ecf3">100% private</text>
      <rect x="520" y="470" width="150" height="52" rx="26" fill="none" stroke="#262d38" stroke-width="2"/>
      <text x="546" y="503" fill="#e7ecf3">No signup</text>
    </g>
  </g>
</svg>
